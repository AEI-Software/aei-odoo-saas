---
# ServiceAccount for portal to call K8s API
apiVersion: v1
kind: ServiceAccount
metadata:
  name: saas-portal
  namespace: aeisoftware

---
# ClusterRole: portal needs wide access to manage odoo-* namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: saas-portal-role
rules:
  - apiGroups: [""]
    resources: [namespaces, pods, pods/exec, pods/log, services, configmaps, secrets, persistentvolumeclaims, limitranges, resourcequotas]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, delete]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  # Topología PG_TOPOLOGY=cnpg: el portal crea el Cluster CNPG del tenant y la
  # CiliumNetworkPolicy de egress al API server (pg_cluster_manifest /
  # pg_cilium_apiserver_policy_manifest). Sin esto: 403 al provisionar.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, delete]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: saas-portal-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: saas-portal-role
subjects:
  - kind: ServiceAccount
    name: saas-portal
    namespace: aeisoftware     # production
  - kind: ServiceAccount
    name: saas-portal
    namespace: staging          # staging
