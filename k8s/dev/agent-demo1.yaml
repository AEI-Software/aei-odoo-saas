# =============================================================================
# k8s/dev/agent-demo1.yaml — Phase 1 spike: tenant AI agent for odoo-demo1
#
# Hand-written for the Phase 1 MVP slice (see /home/kali/.claude/plans/
# parsed-wobbling-dusk.md). NOT generated by portal/k8s_utils/manifests.py —
# that generator work is Phase 2. This file exists only to prove the
# end-to-end flow on one tenant before the real generators get built.
#
# Secrets below use placeholder values — replace ANTHROPIC_API_KEY and
# AGENT_WEBHOOK_SECRET before applying, and set the same
# AGENT_WEBHOOK_SECRET / AGENT_URL on the odoo Deployment's env
# (kubectl set env deployment/odoo -n odoo-demo1 AGENT_WEBHOOK_SECRET=... AGENT_URL=http://agent:8000).
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secret
  namespace: odoo-demo1
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
  AGENT_WEBHOOK_SECRET: "REPLACE_ME"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-workspace
  namespace: odoo-demo1
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: odoo-demo1
  labels:
    app: agent
    tenant: demo1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
        tenant: demo1
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # Without fsGroup, the mounted PVC lands owned by root:root and the
        # non-root `agent` user (uid 1000, baked into the image by
        # Dockerfile's adduser) can't write to /data — verified as a real
        # PermissionError on session_store.py's tmp-file write during the
        # Phase 1 live test.
        fsGroup: 1000
      containers:
        - name: agent
          image: ghcr.io/aei-software/aei-odoo-saas/agent:dev
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ODOO_URL
              value: "http://odoo:8069"
            - name: AGENT_MODEL
              value: "claude-haiku-4-5-20251001"
            - name: AGENT_MAX_TURNS
              value: "12"
            - name: AGENT_MAX_BUDGET_USD
              value: "0.50"
            - name: SESSION_STORE_PATH
              value: "/data/sessions.json"
            - name: AGENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: AGENT_WEBHOOK_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: ANTHROPIC_API_KEY
          volumeMounts:
            - name: agent-workspace
              mountPath: /data
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: agent-workspace
          persistentVolumeClaim:
            claimName: agent-workspace

---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: odoo-demo1
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
# Supplementary to the existing tenant-isolation policy (k8s manifests are
# additive across NetworkPolicy objects selecting the same pods) — adds the
# intra-namespace odoo<->agent traffic that tenant-isolation doesn't grant
# (it only allows ingress from other namespaces). See the plan's "Provisioning
# / K8s changes" section — the real fix folds this into network_policy_manifest
# in Phase 2; this is a standalone policy for the spike so the generator
# doesn't need to change yet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-isolation
  namespace: odoo-demo1
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: odoo
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app: agent
      ports:
        - protocol: TCP
          port: 8069
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: agent
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: odoo
      ports:
        - protocol: TCP
          port: 8069
