# =============================================================================
# k8s/dev/agent-aiassist2.yaml — Phase 1/2 test tenant: odoo-aiassist2
#
# Hand-written for testing (see /home/kali/.claude/plans/parsed-wobbling-dusk.md).
# NOT generated by portal/k8s_utils/manifests.py — that generator work is
# still Phase 2. Unlike the earlier demo1 spike, this tenant WAS provisioned
# through the real portal API (saas.instance.action_provision), so it shows
# up under SaaS Instances / Subscriptions in the admin UI.
#
# No ANTHROPIC_API_KEY here — BYOK: the tenant sets their own key under
# Settings > AEI Assistant (saas_ai_agent/models/res_config_settings.py),
# and the agent pod fetches it per-turn from GET /ai_agent/llm_config.
# Only AGENT_WEBHOOK_SECRET (platform-internal auth) is a real secret.
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secret
  namespace: odoo-aiassist2
type: Opaque
stringData:
  AGENT_WEBHOOK_SECRET: "REPLACE_ME"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-workspace
  namespace: odoo-aiassist2
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: odoo-aiassist2
  labels:
    app: agent
    tenant: aiassist2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
        tenant: aiassist2
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: ghcr.io/aei-software/aei-odoo-saas/agent:feat-cloud-portability
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ODOO_URL
              value: "http://odoo:8069"
            - name: AGENT_MAX_TURNS
              value: "12"
            - name: AGENT_MAX_BUDGET_USD
              value: "0.50"
            - name: SESSION_STORE_PATH
              value: "/data/sessions.json"
            - name: AGENT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: agent-secret
                  key: AGENT_WEBHOOK_SECRET
          volumeMounts:
            - name: agent-workspace
              mountPath: /data
          resources:
            requests:
              cpu: 256m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 20
      volumes:
        - name: agent-workspace
          persistentVolumeClaim:
            claimName: agent-workspace

---
apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: odoo-aiassist2
spec:
  selector:
    app: agent
  ports:
    - name: http
      port: 8000
      targetPort: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-isolation
  namespace: odoo-aiassist2
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: odoo
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app: agent
      ports:
        - protocol: TCP
          port: 8069
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: agent
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: odoo
      ports:
        - protocol: TCP
          port: 8069
