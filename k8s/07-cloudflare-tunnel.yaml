# k8s/07-cloudflare-tunnel.yaml
# Cloudflare Tunnel — ingress del clúster vía una única ruta COMODÍN.
#
# El tunnel NO enruta por tenant: publica un solo hostname comodín hacia Traefik,
# y Traefik reparte por Host: header con los Ingress de cada tenant. Así provisionar
# un tenant nuevo no requiere ninguna llamada a la API de Cloudflare.
#
#   *.<BASE_DOMAIN>  →  http://traefik.kube-system:80
#
# IMPORTANTE: el routing es remote-managed (el tunnel corre con --token, así que la
# config de ingress vive en Cloudflare, no en este manifiesto). Se configura con:
#   CF_API_TOKEN=... CF_ACCOUNT_ID=... CF_ZONE_ID=... CF_TUNNEL_ID=... \
#   WILDCARD_HOSTNAME='*.aeisoftware.com' TRAEFIK_SERVICE='http://traefik.kube-system:80' \
#   python3 setup_cloudflare_wildcard_tunnel.py --dry-run
# …o a mano en Zero Trust > Networks > Tunnels > <tunnel> > Public Hostname.
#
# El comodín debe ser de UN solo nivel (`*.aeisoftware.com`): el Universal SSL de
# Cloudflare no cubre `*.sub.dominio.com`, así que un comodín anidado resuelve por
# DNS pero rompe el handshake TLS. Ver infra/environments/testbed.env.
#
# El pod DEBE correr in-cluster: `traefik.kube-system` solo resuelve por DNS de k8s.
#
# ⚠️  setup_cloudflare_wildcard_tunnel.py REEMPLAZA todas las rutas del tunnel que
#     recibe en CF_TUNNEL_ID. Correrlo contra el tunnel del host cruzoil
#     (contenedor 6ad434184e13, cargas de terceros) las borraría todas.
#     Verificar siempre el CF_TUNNEL_ID del entorno antes de ejecutarlo.
#
# ⚠️  El Secret cloudflared-token se crea en apply-manifests.sh desde .secrets.env
# NO incluir el token en este archivo — está en .gitignore
# El token se inyecta con:
#   kubectl -n cloudflare create secret generic cloudflared-token \
#     --from-literal=TUNNEL_TOKEN="${CLOUDFLARE_TUNNEL_TOKEN}" --dry-run=client -o yaml | kubectl apply -f -
---
apiVersion: v1
kind: Namespace
metadata:
  name: cloudflare
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflare
  labels:
    app: cloudflared
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.3.0
          args:
            - tunnel
            - --no-autoupdate
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: TUNNEL_TOKEN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Sin probes — igual que el docker-compose que funciona.
          # k8s reinicia el pod automáticamente si el proceso muere.
      restartPolicy: Always
