services:
  db:
    image: postgres:16-alpine
    container_name: aei-odoo18-db
    restart: unless-stopped
    network_mode: bridge
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - aei_odoo18_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: ./docker/odoo
      dockerfile: Dockerfile
    image: aei-odoo-saas-local:18.0
    container_name: aei-odoo18-web
    restart: unless-stopped
    network_mode: bridge
    depends_on:
      db:
        condition: service_healthy
    links:
      - db:db
    ports:
      - "8075:8069"
      - "8092:8072"
    environment:
      HOST: db
      PORT: "5432"
      USER: odoo
      PASSWORD: odoo
    volumes:
      - aei_odoo18_filestore:/var/lib/odoo
      - ./:/mnt/workspace
      - ./docker/odoo/odoo.conf:/etc/odoo/odoo.conf
    command:
      - odoo
      - -c
      - /etc/odoo/odoo.conf
      - --dev=xml,reload
      - --workers=0

volumes:
  aei_odoo18_pgdata:
  aei_odoo18_filestore:

