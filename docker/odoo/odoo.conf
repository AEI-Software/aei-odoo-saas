[options]
; Database Configuration
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo

; Master Password
admin_passwd = admin123

; Addons and Data Paths
addons_path = /mnt/workspace/addons,/mnt/workspace/external_addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; Runtime and Longpolling (Local Development)
workers = 0
max_cron_threads = 1
gevent_port = 8072
proxy_mode = False

; Resource Limits
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200
