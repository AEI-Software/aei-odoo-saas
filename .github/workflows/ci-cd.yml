# ═══════════════════════════════════════════════════════════════
# CI/CD & DEVSECOPS PIPELINE — AEI Software (Odoo 18 SaaS + K8s)
# ═══════════════════════════════════════════════════════════════
# Flow:
#   [0] supply-chain-guard → Repo malware/backdoor checks (VSCode auto-tasks, obfuscated JS, CSRF gate)
#   [1] security-scan      → Gitleaks + Bandit SAST + Semgrep OWASP + pip-audit SCA + Trivy IaC
#   [2] validate           → Flake8, Python/XML/YAML syntax, Odoo __manifest__.py schema validation
#   [3] deploy-staging     → Rollout restart of staging on push to main (when 0, 1, and 2 pass)
#
# Standards: OWASP Top 10 (A02/A03/A05/A06/A08), NIST SSDF (PO.3, PW.7, RV.1),
# ISO 27001 (A.8.25/A.8.28/A.8.32), CIS GitHub / SLSA.
#
# Optional Deploy Secrets (staging): HOST_IP, SSH_USER, SSH_PRIVATE_KEY
# ═══════════════════════════════════════════════════════════════

name: CI/CD and DevSecOps — AEI Odoo SaaS

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - "18.0"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-guard:
    name: Supply-Chain Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run supply-chain and CSRF security gate
        run: bash .github/scripts/security_gate.sh

  security-scan:
    name: DevSecOps — SAST, Secrets, SCA & IaC
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full history for Gitleaks
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks CLI
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.27.2/gitleaks_8.27.2_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Secret scanning (Gitleaks)
        run: ./gitleaks detect --source . --no-git --config .gitleaks.toml --log-level warn --exit-code 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SAST & SCA security tools
        run: pip install bandit==1.8.3 pip-audit==2.8.0 semgrep

      - name: Bandit SAST (blocking on High/Medium severity)
        run: bandit -r addons/ portal/ -c bandit.yaml -ll -ii --skip B101,B108,B311 -f json -o bandit-report.json

      - name: Upload Bandit security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Dependency vulnerability audit (pip-audit SCA)
        continue-on-error: true
        run: |
          for req in $(find . -name requirements.txt -not -path "./.git/*" -not -path "./external_addons/*"); do
            echo "===> Auditing dependencies in: $req"
            pip-audit -r "$req" --desc on
          done

      - name: OWASP Top 10 SAST (Semgrep)
        continue-on-error: true
        run: semgrep scan --config p/owasp-top-ten addons/ portal/ --json -o owasp-top10-report.json

      - name: Upload OWASP Top 10 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-top10-security-report
          path: owasp-top10-report.json
          if-no-files-found: ignore

      - name: Trivy IaC & Dockerfile misconfiguration scan (K8s & Docker)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest config /work \
            --severity CRITICAL,HIGH --format table

  validate:
    name: Validate Odoo Addons, Portal & K8s Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies (Flake8 & PyYAML)
        run: pip install flake8 pyyaml

      - name: Flake8 critical syntax and undefined names check
        run: flake8 addons/ portal/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Structure gate (file size, models layout, names, comments)
        run: python3 .github/scripts/structure_gate.py

      - name: Validate Python, XML, and YAML syntax
        run: |
          python3 - <<'PY'
          import pathlib, sys
          import xml.etree.ElementTree as ET
          import yaml

          errors = 0
          for p in pathlib.Path(".").rglob("*"):
              if ".git" in p.parts or not p.is_file():
                  continue
              try:
                  if p.suffix == ".py":
                      compile(p.read_bytes(), str(p), "exec")
                  elif p.suffix == ".xml":
                      ET.parse(str(p))
                  elif p.suffix in (".yml", ".yaml"):
                      list(yaml.safe_load_all(p.read_text(encoding="utf-8")))
              except Exception as exc:
                  print(f"SYNTAX ERROR in {p}: {exc}")
                  errors += 1
          sys.exit(1 if errors else 0)
          PY

      - name: Validate Odoo __manifest__.py and __init__.py in addons/ and external_addons/
        run: |
          python3 - <<'PY'
          import ast, pathlib, sys

          errors = 0
          required_keys = {"name", "version", "depends", "license"}

          for group in ("addons", "external_addons"):
              base = pathlib.Path(group)
              if not base.is_dir():
                  continue
              for mod_dir in sorted(base.iterdir()):
                  if not mod_dir.is_dir() or mod_dir.name.startswith("."):
                      continue
                  manifest_file = mod_dir / "__manifest__.py"
                  init_file = mod_dir / "__init__.py"
                  if not manifest_file.is_file():
                      print(f"ERROR: Missing __manifest__.py in {mod_dir}")
                      errors += 1
                      continue
                  if not init_file.is_file():
                      print(f"ERROR: Missing __init__.py in {mod_dir}")
                      errors += 1
                  try:
                      data = ast.literal_eval(manifest_file.read_text(encoding="utf-8"))
                      missing = required_keys - set(data.keys())
                      if missing:
                          print(f"ERROR: {manifest_file} missing keys: {sorted(missing)}")
                          errors += 1
                  except Exception as exc:
                      print(f"ERROR: Invalid manifest dictionary in {manifest_file}: {exc}")
                      errors += 1

          sys.exit(1 if errors else 0)
          PY

  # STAGING ONLY. Branch strategy (see CLAUDE.md): main = staging, 18.0 = production.
  # Production (18.0) stays a manual rollout on purpose. The Odoo pod clones the
  # branch in an init container on start, so a rollout restart is all that is needed.
  # NOTE: the control node IP in CLAUDE.md is private (10.40.x.x); a GitHub-hosted
  # runner cannot reach it. This job needs a self-hosted runner or a reachable
  # bastion/VPN. Until then it skips itself when HOST_IP is not configured.
  deploy-staging:
    name: Deploy to Staging
    needs: [supply-chain-guard, security-scan, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST_IP_SET: ${{ secrets.HOST_IP != '' }}
    steps:
      - name: Notice when deployment secrets are missing
        if: env.HOST_IP_SET != 'true'
        run: echo "HOST_IP secret is not configured. Skipping staging deployment."

      - name: Rollout restart on staging
        if: env.HOST_IP_SET == 'true'
        uses: appleboy/ssh-action@v1.2.1
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: "10m"
          script: |
            set -euo pipefail
            kubectl rollout restart deployment/odoo-stg -n staging
            kubectl rollout status deployment/odoo-stg -n staging --timeout=300s

